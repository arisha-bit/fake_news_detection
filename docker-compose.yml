services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fakenews
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_ENABLE_ONEDNN_OPTS=0
      - TF_CPP_MIN_LOG_LEVEL=3
      - TF_NUM_INTEROP_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - faiss_index:/app/app/ml/embeddings/index
      - clip_index:/app/app/ml/clip/index
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  faiss_index:
  clip_index:
